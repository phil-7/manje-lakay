{% extends "base.html" %}

{% block title %}Manje Lakay - Grocery List{% endblock %}

{% block content %}
  <h1>Grocery List</h1>
  <p class="subtitle">Built automatically from whatever's currently on your Plan.</p>

  <div id="planned-summary"></div>

  <button type="button" class="reset-checklist-btn" id="reset-checklist-btn">
    Reset checklist
  </button>

  <form id="custom-grocery-form" class="custom-grocery-form">
    <input id="custom-grocery-name" type="text" maxlength="200" placeholder="Add a custom grocery" required />
    <button type="submit">Add grocery</button>
  </form>

  <label class="show-recipes-toggle">
    <input type="checkbox" id="show-recipes-checkbox" />
    Show which recipe uses each ingredient
  </label>

  <div id="grocery-results">
    <p class="empty-state">Loading...</p>
  </div>
{% endblock %}

{% block scripts %}
  <script src="/static/grocery.js?v=4"></script>
{% endblock %}
