{% extends "base.html" %}

{% block title %}Manje Lakay - All Recipes{% endblock %}

{% block content %}
  <h1>All Recipes</h1>
  <p class="subtitle">Everything you've saved. Add any of these to your Plan.</p>

  <div class="recipe-controls">
    <label class="recipe-search-label" for="recipe-search">Search recipes</label>
    <input type="search" id="recipe-search" placeholder="Search by title or ingredient" autocomplete="off" />
    <label class="recipe-sort-label" for="recipe-sort">Sort by</label>
    <select id="recipe-sort">
      <option value="a-to-z">Alphabetical: A to Z</option>
      <option value="z-to-a">Alphabetical: Z to A</option>
      <option value="ingredients">Number of ingredients</option>
      <option value="earliest">Earliest added</option>
      <option value="latest">Latest added</option>
    </select>
  </div>

  <div class="recipe-list" id="recipe-list">
    <p class="empty-state">Loading...</p>
  </div>
{% endblock %}

{% block scripts %}
  <script src="/static/all-recipes.js"></script>
{% endblock %}
