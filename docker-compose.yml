services:
  manje-lakay:
    image: ghcr.io/phil-7/manje-lakay:latest
    container_name: manje-lakay
    ports:
      - "8000:8000"
    volumes:
      # Keeps the database file on the HOST machine, outside the
      # container. This is what makes updates safe: rebuilding or
      # replacing the container never touches this folder, so recipes
      # survive every update.
      - ./data:/app/data
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: manje-lakay-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
    restart: unless-stopped